[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brokenmirror"
version = "0.1.0"
authors = [
  { name = "Developer" }
]
description = "Stealth topological obfuscation and encrypted sharding tool for source code repositories."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "cryptography>=42.0.0",
  "fusepy>=3.0.1",
]

[project.scripts]
brokenmirror = "brokenmirror.cli:main"
bm = "brokenmirror.cli:main"